<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plaster&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Spiral Sounds</title>
</head>

<body>
  <div class="top-banner">
    <button class="menu-toggle" aria-label="Toggle menu">☰</button>
    <nav class="header-menu" aria-label="Main menu">
      <a href="#" id="login-link">Login</a>
      <a href="#">Cart</a>
      <form role="search" class="search-form">
        <label for="search-input" class="visually-hidden">Search products</label>
        <div class="search-input-wrapper">
          <input type="text" placeholder="Search..." id="search-input">
          <button type="button" class="search-clear" id="search-clear" aria-label="Clear search" style="display: none;">&times;</button>
        </div>
      </form>
    </nav>
  </div>

  <!-- Login Modal -->
  <div class="modal-overlay" id="login-modal">
    <div class="modal-content">
      <button class="modal-close" id="close-login" aria-label="Close login modal">&times;</button>
      <div class="modal-header">
        <h2>Welcome to Spiral Sounds</h2>
        <p>Sign in to your account</p>
      </div>
      <form class="login-form" id="login-form">
        <div class="form-group" id="name-group" style="display: none;">
          <label for="name">Name (optional)</label>
          <input 
            type="text" 
            id="name" 
            name="name" 
            placeholder="Enter your name"
            autocomplete="name"
          >
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="Enter your email"
            required
            autocomplete="email"
          >
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          >
        </div>
        <div class="form-options" id="login-options">
          <label class="checkbox-label">
            <input type="checkbox" id="remember-me">
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-password">Forgot password?</a>
        </div>
        <button type="submit" class="login-btn" id="submit-btn">Sign In</button>
        <p class="signup-link">
          <span id="toggle-text">Don't have an account?</span> 
          <a href="#" id="toggle-auth-mode">Sign up</a>
        </p>
      </form>
    </div>
  </div>

  <header> 
    <img src="/images/spiral_logo.png" alt="Spiral Sounds Logo">
    <div class="header-text">
      <h1>Spiral Sounds</h1>
      <p class="subhead">The best in vinyl</p>
    </div>
  </header>

  <section class="genre-select-container">
    <label for="genre-select">View by genre</label>
    <select id="genre-select">
      <option value="">Show All</option>
    </select>
    <p class="product-count" id="product-count"></p>
  </section>

  <main class="products" id="products-container"></main>
    <footer>
        <p>© Spiral Sounds</p>
    </footer>
    <script src="index.js" type="module"></script>
</body>

</html>
